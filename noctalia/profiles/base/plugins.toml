[plugins]
# auto_update = false
enabled = [
    "noctalia/translator",
    "nullptr/fish",
    "oldirtty/color_picker",
    "noctalia/example",
    "noctalia/kaomoji",
    "k4n4t4/hypr-submap",
    "alexander/screen-toolkit",
    "nullptr/bongocat",
    "nullptr/lyrics"
]

[[plugins.source]]
kind = "git"
location = "https://github.com/noctalia-dev/official-plugins"
name = "official"

[[plugins.source]]
kind = "git"
location = "https://github.com/noctalia-dev/community-plugins"
name = "community"

[[plugins.source]]
kind = "path"
location = "~/dotfiles/noctalia/plugins"
name = "dev"

[plugin_settings."nullptr/lyrics"]
providers = [ "lrclib", "netease", "musixmatch" ]
allow_plain_text = false
enhanced = true
selector_placement = "floating"

