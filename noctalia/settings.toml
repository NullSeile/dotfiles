config_version = 7

[audio]
enable_overdrive = true

[bar]
order = [ "bar" ]

    [bar.bar]
    background_opacity = 0.0
    capsule = true
    capsule_radius = 8
    capsule_thickness = 1
    center = [ "clock", "privacy" ]
    end = [ "network", "battery", "group:g1", "tray", "todo", "cat (kanata)" ]
    font_weight = 400
    margin_edge = 8
    margin_ends = 10
    padding = 0
    shadow = false
    start = [ "workspaces", "volume", "brightness", "media", "lyrics", "bluetooth" ]
    thickness = 26
    widget_spacing = 4

        [bar.bar.dead_zone.actions]
        middle = "settings-toggle"

        [[bar.bar.capsule_group]]
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "cpu", "sysmon", "temp", "ram" ]
        opacity = 1.0
        padding = 6.0

[battery.device."/org/freedesktop/UPower/devices/battery_hidpp_battery_0"]
warning_threshold = 10

[brightness]
enable_ddcutil = true

[calendar]
enabled = true
refresh_minutes = 5

    [calendar.account.personal_google]
    name = "Google"
    type = "google"

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "clipboard"

[[control_center.shortcuts]]
type = "mic_mute"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[location]
address = "Cerdanyola, Spain"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 957.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        show_login_button = true

[plugin_settings."h465855hgg/lyrics"]
animation = "fade"
custom_url = "https://lyricsplus.prjktla.my.id/v2/lyrics/get?title={title}&artist={artist}"
display_mode = "lyrics"
marquee_speed = 50
scroll_mode = "static"
selector_placement = "floating"

[plugin_settings."nightwatch75/todo"]
panel_placement = "floating"

[plugins]
auto_update = false
enabled = [
    "noctalia/translator",
    "nullptr/fish",
    "oldirtty/color_picker",
    "noctalia/bongocat",
    "h465855hgg/lyrics",
    "nullptr/bongocat",
    "noctalia/example",
    "noctalia/kaomoji",
    "k4n4t4/hypr-submap"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    auto_update = true
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "path"
    location = "~/dotfiles/noctalia/plugins"
    name = "dev"

[shell]
app_icon_color = "on_surface"
avatar_path = "/home/lia/Pictures/2025-06-16-230436_hyprshot.png"
external_ip_enabled = true
font_family = "Maple Mono"
launch_apps_as_systemd_services = true
password_style = "random"
polkit_agent = true
settings_show_advanced = true
telemetry_enabled = true

    [shell.animation]
    speed = 2.0

    [shell.launcher]
    categories = false
    compact = true
    session_search = true

        [shell.launcher.providers.session]
        global = true

    [shell.panel]
    control_center_placement = "floating"
    launcher_session_search = true
    open_near_click_control_center = true
    session_placement = "floating"
    shadow = false
    wallpaper_placement = "floating"

[theme]
builtin = "Kanagawa"
community_palette = "Rose Pine Moon"
mode = "dark"
source = "builtin"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "ghostty", "hyprland", "kcolorscheme", "qt" ]
    community_ids = [
        "spicetify",
        "zen-browser",
        "obsidian",
        "walker",
        "bat",
        "discord",
        "opencode",
        "steam",
        "zathura",
        "hyprtoolkit"
    ]

[wallpaper]
directory = "/home/lia/dotfiles/himawari-wallpaper"
enabled = false

    [wallpaper.default]
    path = "/home/lia/dotfiles/himawari-wallpaper/lastest.png"

    [wallpaper.last]
    path = "/home/lia/dotfiles/himawari-wallpaper/lastest.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/lia/dotfiles/himawari-wallpaper/lastest.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/lia/dotfiles/himawari-wallpaper/lastest.png"

[widget.battery]
hide_when_full = true

[widget.bluetooth]
show_label = true

[widget.bongo-cat]
type = "nullptr/bongocat:bongo-cat"

[widget.bongocat]
input_device = "/dev/input/event27"
script = "scripts/bongocat.lua"
type = "scripted"

[widget.brightness]
show_label = false

[widget.cat]
input_device = "/dev/input/event27"
input_devices = [ "/dev/input/event27" ]
type = "noctalia/bongocat:cat"

[widget."cat (kanata)"]
capsule = true
capsule_padding = 3
scale = 1.4000000000000001
type = "nullptr/bongocat:cat (kanata)"

[widget.cat_2]
type = "noctalia/bongocat:cat"

[widget.cat_3]
audio_spectrum = true
enabled = true
type = "noctalia/bongocat:cat"
use_mpris_filter = true

[widget.clock]
anchor = true
format = "{:%H:%M} {:%a}, {:%b} {:%d}"
tooltip_format = "{:%F} {:%H:%M:%S}"

[widget.cpu]
display = "text"

[widget.declarative]
type = "noctalia/example:declarative"

[widget.hello]
type = "noctalia/example:hello"

[widget.hello_2]
type = "noctalia/example:hello"

[widget.hello_3]
type = "noctalia/example:hello"

[widget.hello_4]
type = "noctalia/example:hello"

[widget.hello_5]
type = "noctalia/example:hello"

[widget.hello_6]
type = "noctalia/example:hello"

[widget.indicator]
type = "rxtsel/portctl:indicator"

[widget.lyrics]
hide_when_paused = true
show_artist = false
show_cover = false
show_glyph = false
type = "h465855hgg/lyrics:lyrics"

[widget.media]
hide_when_no_media = true
max_length = 170
title_scroll = "on_hover"

[widget.privacy]
hide_inactive = true

[widget.ram]
display = "text"
show_label = false
stat = "ram_pct"

[widget.sysmon]
display = "text"
stat = "gpu_usage"

[widget.taskbar]
group_by_workspace = true

[widget.temp]
display = "text"

[widget.todo]
type = "nightwatch75/todo:todo"

[widget.tray]
hidden = [ "nm-applet" ]

[widget.upbeat]
type = "neuro/upbeat:upbeat"

[widget.volume]
show_label = false

[widget.workspaces]
font_weight = 700