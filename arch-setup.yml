---
- name: Setup Arch Linux Dotfiles and Configurations
  hosts: localhost
  connection: local
  gather_facts: yes
  vars:
    dotfiles_dir: "{{ playbook_dir }}"

  tasks:
    - name: Install required packages
      ansible.builtin.pacman:
        name:
          - hyprland
          - hyprpicker
          - nautilus
          - swaybg
          - noctalia
          - playerctl

          - ly
          - uwsm
          - network-manager-applet

          - neovim
          - tree-sitter-cli

          - cmake # needed for hyprpm
          - yazi
          - lazygit
          - tmux
          - uv
          - fish
          - github-cli

          - ghostty
          - vesktop
          - helium-browser-bin
          - keepassxc

        state: present
      become: yes

    - name: Set fish as the default shell for the user
      ansible.builtin.user:
        name: "{{ ansible_facts['user_id'] }}"
        shell: /usr/bin/fish
      become: yes

    - name: Remove getty as the default display manager
      ansible.builtin.systemd:
        name: getty@tty1.service
        enabled: no
      become: yes

    - name: Enable ly as the default display manager
      ansible.builtin.systemd:
        name: ly@tty1.service
        enabled: yes
      become: yes

    - name: Ly config symlink
      ansible.builtin.file:
        src: "{{ dotfiles_dir }}/ly/config.ini"
        dest: "/etc/ly/config.ini"
        state: link
        force: yes
      become: yes

    - name: Ensure ~/.config directory exists
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.config"
        state: directory
        mode: '0755'

    - name: Ensure ~/.config/systemd/user directory exists
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user"
        state: directory
        mode: '0755'

    - name: Create dotfile symlinks
      ansible.builtin.file:
        src: "{{ dotfiles_dir }}/{{ item.src }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/{{ item.dest }}"
        state: link
        force: yes
      loop:
        - { src: "ghostty", dest: ".config/ghostty" }
        - { src: "tmux", dest: ".config/tmux" }
        - { src: "fish", dest: ".config/fish" }
        - { src: "nvim", dest: ".config/nvim" }
        - { src: "yay", dest: ".config/yay" }
        - { src: "hypr", dest: ".config/hypr" }
        - { src: "noctalia", dest: ".config/noctalia" }
        - { src: "noctalia/settings.toml", dest: ".local/state/noctalia/settings.toml" }
        - { src: "kanata", dest: ".config/kanata" }
        - { src: "kanata/kanata.service", dest: ".config/systemd/user/kanata.service" }
        - { src: "himawari-wallpaper/himawari.service", dest: ".config/systemd/user/himawari.service" }
        - { src: "himawari-wallpaper/himawari.timer", dest: ".config/systemd/user/himawari.timer" }

    - name: Install tmux tpm plugin manager
      ansible.builtin.git:
        repo: "https://github.com/tmux-plugins/tpm"
        dest: "{{ ansible_facts['env']['HOME'] }}/.tmux/plugins/tpm"
        update: yes

    - name: Ensure uinput group exists
      ansible.builtin.group:
        name: uinput
        state: present
      become: yes

    - name: Add user to input and uinput groups
      ansible.builtin.user:
        name: "{{ ansible_facts['user_id'] }}"
        groups: input,uinput
        append: yes
      become: yes

    - name: Enable systemd user services
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: yes
        scope: user
        daemon_reload: yes
      loop:
        - kanata
